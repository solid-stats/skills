# Synthetic teaching contract, not existing endpoints. Replace domain decisions before use.
openapi: 3.0.3
info:
  title: Solid Stats example catalog
  version: 0.1.0
  description: Synthetic bounded contract illustrating the authoring conventions.
paths:
  /example-items:
    get:
      operationId: listExampleItems
      summary: List example items
      description: 'Returns items ordered by immutable creation time descending, then
        UUID

        descending. The opaque cursor binds the ordering and any active filters.

        New items ahead of the cursor appear after a refresh, not on later pages.

        Deleted items are omitted. No snapshot or total count is promised.

        '
      security: []
      parameters:
      - name: cursor
        in: query
        description: Omit for the first page. A malformed cursor returns 400.
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page, including an empty terminal page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplePage'
        '400':
          description: The cursor is malformed or belongs to another query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorError'
        '422':
          description: A query parameter fails its declared schema constraints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidQueryError'
components:
  schemas:
    ExampleItem:
      type: object
      required:
      - id
      - name
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    ExamplePage:
      type: object
      required:
      - items
      - hasMore
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExampleItem'
        hasMore:
          type: boolean
          description: Whether another page is available at evaluation time.
        nextCursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1024
          description: Null when hasMore is false; otherwise a continuation token.
      additionalProperties: false
    InvalidCursorError:
      type: object
      required:
      - statusCode
      - error
      - errorCode
      - message
      properties:
        statusCode:
          type: integer
          enum:
          - 400
        error:
          type: string
          enum:
          - Bad Request
        message:
          type: string
        errorCode:
          type: string
          enum:
          - invalid_cursor
      additionalProperties: false
      description: 'Synthetic condition: the cursor cannot be decoded.'
    InvalidQueryError:
      type: object
      required:
      - statusCode
      - error
      - errorCode
      - message
      properties:
        statusCode:
          type: integer
          enum:
          - 422
        error:
          type: string
          enum:
          - Unprocessable Entity
        message:
          type: string
        errorCode:
          type: string
          enum:
          - invalid_query
      additionalProperties: false
      description: 'Synthetic condition: query parameters fail their declared schema.'
    CursorScopeMismatchError:
      type: object
      additionalProperties: false
      description: 'Synthetic condition: the cursor belongs to a different query scope.'
      required:
      - statusCode
      - error
      - errorCode
      - message
      - details
      properties:
        statusCode:
          type: integer
          enum:
          - 400
        error:
          type: string
          enum:
          - Bad Request
        errorCode:
          type: string
          enum:
          - cursor_scope_mismatch
        message:
          type: string
        details:
          type: object
          additionalProperties: false
          required:
          - parameter
          properties:
            parameter:
              type: string
              enum:
              - cursor
    CursorError:
      oneOf:
      - $ref: '#/components/schemas/InvalidCursorError'
      - $ref: '#/components/schemas/CursorScopeMismatchError'
      discriminator:
        propertyName: errorCode
        mapping:
          invalid_cursor: '#/components/schemas/InvalidCursorError'
          cursor_scope_mismatch: '#/components/schemas/CursorScopeMismatchError'
